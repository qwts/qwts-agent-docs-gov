# This repository's own CI: the tool tests, the docs-gov gate run against this
# repository's docs, and markdownlint. Hosted runners: the repository is public.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false
      - name: Install locked dependencies
        run: npm ci
      - name: Tests
        run: npm test
      - name: Docs governance (this repository's own docs)
        run: npm run docs:gov
      - name: Markdown lint
        run: npm run lint:markdown
